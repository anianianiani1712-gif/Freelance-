<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karina — Vocabulary Challenge</title>
<style>
:root{--pink:#ff5f9e;--hot:#ff2f78;--cream:#fff8f1;--ink:#34263a;--purple:#7b5cff;--mint:#65d6b3;--yellow:#ffd75e;--red:#ff5c67}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fff3f7,#fff9e9);color:var(--ink)}
.app{max-width:980px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,var(--pink),var(--purple));color:white;border-radius:30px;padding:28px;box-shadow:0 16px 40px #7b5cff30}
h1{margin:0 0 8px;font-size:clamp(30px,6vw,58px)}.sub{opacity:.92}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{background:#ffffff26;padding:10px 14px;border-radius:999px;font-weight:800}
.tabs{display:flex;gap:10px;overflow:auto;padding:18px 0}.tab{border:0;background:white;padding:12px 16px;border-radius:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px #00000010;white-space:nowrap}.tab.active{background:var(--ink);color:white}
.panel{display:none;background:white;border-radius:28px;padding:24px;min-height:430px;box-shadow:0 15px 40px #0000000d}.panel.active{display:block}
.topic{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.topic button{border:1px solid #eee;background:#fafafa;border-radius:999px;padding:8px 11px;cursor:pointer}.topic button.active{background:#ffe1ed;border-color:#ff9fc3}
.card{height:260px;perspective:1000px;cursor:pointer;max-width:620px;margin:25px auto}.inner{height:100%;position:relative;transition:.55s;transform-style:preserve-3d}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:clamp(26px,5vw,44px);font-weight:900;background:linear-gradient(145deg,#fff1f7,#fff9db);border:2px solid #ffd2e3}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#eae5ff,#eafff8)}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:900;cursor:pointer;background:var(--ink);color:white}.btn.alt{background:#eee;color:var(--ink)}
.question{text-align:center;font-size:28px;font-weight:900;margin:28px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:700px;margin:auto}.option{border:2px solid #eee;background:white;border-radius:18px;padding:18px;font-size:17px;font-weight:800;cursor:pointer}.option:hover{border-color:var(--pink)}.correct{background:#dff8ef!important;border-color:var(--mint)!important}.wrong{background:#ffe3e5!important;border-color:var(--red)!important}
.timer{font-size:42px;font-weight:1000;text-align:center;color:var(--hot)}.inputrow{display:flex;gap:8px;max-width:650px;margin:auto}.inputrow input{flex:1;border:2px solid #ddd;border-radius:16px;padding:16px;font-size:18px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col{display:grid;gap:10px}.matchbtn{border:2px solid #eee;background:#fff;border-radius:16px;padding:14px;cursor:pointer;font-weight:800}.selected{border-color:var(--purple);background:#eeeaff}.matched{opacity:.35;pointer-events:none}.msg{text-align:center;font-weight:900;min-height:28px;margin:15px}.progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));width:0}
.small{text-align:center;color:#786b7d}.finish{text-align:center;padding:50px 10px}.finish b{font-size:54px;color:var(--hot)}
@media(max-width:600px){.options{grid-template-columns:1fr}.match{gap:8px}.panel{padding:16px}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
<section class="hero"><h1>🍭 Vocabulary Challenge</h1><div class="sub">Karina • Travel, City, Airport, Directions & Everyday English</div>
<div class="stats"><div class="pill">⭐ Score: <span id="score">0</span></div><div class="pill">🔥 Streak: <span id="streak">0</span></div><div class="pill">🏆 Best: <span id="best">0</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div></section>
<nav class="tabs">
<button class="tab active" data-p="cards">🃏 Карточки</button><button class="tab" data-p="quiz">🎯 Выбор из 4</button><button class="tab" data-p="speed">⚡ 30 sec</button><button class="tab" data-p="match">🧩 Соединялки</button>
</nav>
<section id="cards" class="panel active"><div class="topic" id="topics"></div><div class="small">Нажми на карточку, чтобы увидеть перевод</div><div class="card" id="card"><div class="inner"><div class="face front" id="front"></div><div class="face back" id="back"></div></div></div><div class="controls"><button class="btn alt" onclick="prevCard()">←</button><button class="btn" onclick="nextCard()">Знаю ✓</button><button class="btn alt" onclick="nextCard()">Ещё раз</button><button class="btn alt" onclick="nextCard()">→</button></div></section>
<section id="quiz" class="panel"><div class="small">Выбери правильный перевод</div><div class="question" id="qword"></div><div class="options" id="opts"></div><div class="msg" id="qmsg"></div><div class="controls"><button class="btn" onclick="newQuiz()">Следующее →</button></div></section>
<section id="speed" class="panel"><div class="timer">⏱ <span id="time">30</span></div><div class="small">Скажи перевод <b>ВСЛУХ</b>, затем оцени себя. <b>I know it = +5 секунд.</b></div><div class="question" id="sword"></div><div class="controls" id="speedChoices" style="display:none"><button class="btn" onclick="speedKnow()">I know it ✓</button><button class="btn alt" onclick="speedRevise()">Better revise ↻</button></div><div class="msg" id="smsg"></div><div class="controls"><button class="btn" id="startBtn" onclick="startSpeed()">Начать раунд</button></div></section>
<section id="match" class="panel"><div class="small">Соедини английское слово с переводом</div><div class="match" id="matchbox"></div><div class="msg" id="mmsg"></div><div class="controls"><button class="btn" onclick="makeMatch()">Новый раунд</button></div></section>
</div>
<script>
const groups={
"🚗 Travel":[["vehicle","транспортное средство"],["way of travelling","способ путешествия"],["long trip","долгая поездка"],["distance","расстояние"],["driving licence","водительские права"],["hire","брать напрокат"],["timetable / schedule","расписание"],["take public transport","пользоваться общественным транспортом"],["on foot","пешком"],["heavy traffic","плотное движение"],["traffic jam","пробка"],["lane","полоса движения"]],
"✈️ Airport":[["be in a hurry","спешить"],["rush","спешить"],["rush to the gate","спешить к выходу на посадку"],["aboard","на борту"],["take your seat","занять своё место"],["get through security","пройти контроль безопасности"],["get out of the plane","выйти из самолёта"],["check the time","посмотреть время"],["seasick","морская болезнь"],["airline","авиакомпания"]],
"🏙️ City":[["main square","главная площадь"],["playground","детская площадка"],["monument","памятник"],["town hall","мэрия"],["bridge","мост"],["police station","полицейский участок"],["stadium","стадион"],["train station","железнодорожный вокзал"],["post office","почта"],["underground passage","подземный переход"],["promenade / river walk","набережная"],["mosque","мечеть"],["temple","храм"]],
"🗺️ Directions":[["How do I get to…?","Как мне добраться до…?"],["the nearest","ближайший"],["go straight","идти прямо"],["cross","перейти / пересечь"],["go round","обойти"],["go through","пройти через"],["take the stairs","пойти по лестнице"],["inside","внутри"],["outside","снаружи"],["opposite","напротив"],["in front of","перед"],["behind","позади"],["next to","рядом с"],["between","между"]],
"🔎 Lost & Found":[["go missing","пропасть / потеряться"],["get lost","заблудиться"],["lose your way","заблудиться"],["lose something","потерять что-либо"],["look for","искать"],["look at","смотреть на"],["search","искать / обыскивать"]],
"🧸 Hobbies":[["kidult","взрослый, увлекающийся игрушками"],["plushie","мягкая игрушка"],["baby doll","кукла-пупс"],["plasticine","пластилин"],["disposable income","свободный доход"],["bag charm","брелок для сумки"],["be into something","увлекаться чем-либо"],["several","несколько"],["a couple of","пара / несколько"],["throw","бросать"],["bring","приносить"]],
"👤 People":[["pretty","симпатичная / красивая"],["attractive","привлекательный"],["handsome","красивый мужчина"],["elderly people","пожилые люди"],["acquaintance","знакомый"],["ladies' man","ловелас"],["womanizer","бабник"],["maiden name","девичья фамилия"]],
"🤒 Health":[["ache","боль"],["headache","головная боль"],["toothache","зубная боль"],["stomach ache","боль в животе"],["hurt","болеть"],["get well soon","выздоравливай скорее"],["take care of yourself","береги себя"],["ill / sick","больной"]],
"🗣️ Everyday":[["Same here","у меня так же"],["It doesn't matter","это неважно"],["I don't mind","я не против"],["I can make it on Thursday","у меня получится в четверг"],["It's not hard at all","это совсем не сложно"],["I was going to…","я собирался / собиралась"],["despite","несмотря на"],["almost","почти"],["whole","весь / целый"],["each","каждый"],["while","пока / в то время как"],["during","во время"],["upset","расстроенный"]],
"🌿 Other":[["herbs","травы"],["seed","семя / семечко"],["wholemeal bread","цельнозерновой хлеб"],["cotton candy","сахарная вата"],["cotton pads","ватные диски"],["borrow","взять взаймы"],["neighbourhood","район / квартал"],["pray","молиться"],["prayer","молитва"]]
};
let topic=Object.keys(groups)[0], idx=0, score=0, streak=0, attempts=0, correct=0;
const all=()=>Object.values(groups).flat(), shuffle=a=>[...a].sort(()=>Math.random()-.5), pick=a=>a[Math.floor(Math.random()*a.length)];
function stats(ok){attempts++;if(ok){score+=10;streak++;correct++}else streak=0;document.querySelector("#score").textContent=score;document.querySelector("#streak").textContent=streak;let b=Math.max(+localStorage.vocabBest||0,score);localStorage.vocabBest=b;document.querySelector("#best").textContent=b;document.querySelector("#bar").style.width=Math.min(100,correct/25*100)+"%"}
document.querySelector("#best").textContent=localStorage.vocabBest||0;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#"+b.dataset.p).classList.add("active")});
const topics=document.querySelector("#topics");Object.keys(groups).forEach((g,i)=>{let b=document.createElement("button");b.textContent=g;b.className=i?"":"active";b.onclick=()=>{topic=g;idx=0;[...topics.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");showCard()};topics.appendChild(b)});
function showCard(){document.querySelector("#card").classList.remove("flip");front.textContent=groups[topic][idx][0];back.textContent=groups[topic][idx][1]}card.onclick=()=>card.classList.toggle("flip");function nextCard(){idx=(idx+1)%groups[topic].length;showCard()}function prevCard(){idx=(idx-1+groups[topic].length)%groups[topic].length;showCard()}showCard();
let q;
function newQuiz(){q=pick(all());qword.textContent=q[0];qmsg.textContent="";let wrong=shuffle(all().filter(x=>x[1]!=q[1])).slice(0,3).map(x=>x[1]);opts.innerHTML="";shuffle([q[1],...wrong]).forEach(t=>{let b=document.createElement("button");b.className="option";b.textContent=t;b.onclick=()=>{[...opts.children].forEach(x=>x.disabled=true);let ok=t===q[1];b.classList.add(ok?"correct":"wrong");if(!ok)[...opts.children].find(x=>x.textContent===q[1]).classList.add("correct");qmsg.textContent=ok?"🔥 Correct! +10":"Правильно: "+q[1];stats(ok)};opts.appendChild(b)})}newQuiz();
let seconds=30,timer=null,sw=null,running=false;
function speedWord(){sw=pick(all());sword.innerHTML=sw[0]+'<div style="font-size:16px;font-weight:700;margin-top:12px;color:#786b7d">Say the translation aloud 👄</div>';smsg.textContent="";speedChoices.style.display="flex"}
function startSpeed(){clearInterval(timer);seconds=30;time.textContent=seconds;running=true;smsg.textContent="GO! Speak!";startBtn.style.display="none";speedChoices.style.display="flex";speedWord();timer=setInterval(()=>{seconds--;time.textContent=seconds;if(seconds<=0){clearInterval(timer);running=false;speedChoices.style.display="none";sword.innerHTML="🏁 TIME!";smsg.textContent="Раунд окончен. Score: "+score;startBtn.textContent="Ещё раунд";startBtn.style.display=""}},1000)}
function speedKnow(){if(!running)return;seconds+=5;time.textContent=seconds;smsg.innerHTML='⚡ +5 sec! <span style="font-weight:600">Перевод: '+sw[1]+'</span>';stats(true);setTimeout(speedWord,500)}
function speedRevise(){if(!running)return;smsg.innerHTML='↻ Запомни: <b>'+sw[1]+'</b>';stats(false);setTimeout(speedWord,900)}
let left=null,right=null;
function makeMatch(){let set=shuffle(all()).slice(0,6), rs=shuffle(set);matchbox.innerHTML='<div class="col" id="ml"></div><div class="col" id="mr"></div>';mmsg.textContent="";set.forEach(x=>mk(ml,x[0],x[0],"l"));rs.forEach(x=>mk(mr,x[1],x[0],"r"))}
function mk(parent,text,key,side){let b=document.createElement("button");b.className="matchbtn";b.textContent=text;b.dataset.key=key;b.onclick=()=>{if(side==="l"){if(left)left.classList.remove("selected");left=b;b.classList.add("selected")}else{if(right)right.classList.remove("selected");right=b;b.classList.add("selected")}if(left&&right){let ok=left.dataset.key===right.dataset.key;if(ok){left.classList.add("matched");right.classList.add("matched");mmsg.textContent="✨ Match!";stats(true)}else{mmsg.textContent="Попробуй ещё";stats(false)}left.classList.remove("selected");right.classList.remove("selected");left=right=null}};parent.appendChild(b)}makeMatch();
</script>
</body></html>
