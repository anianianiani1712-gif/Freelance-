<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les verbes du quotidien</title>
<style>
:root{--wine:#8d3f4b;--rust:#c96945;--gold:#e1aa39;--cream:#fff8ec;--ink:#342820;--ok:#4d8761;--bad:#c14f4f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#f2d28f 0,transparent 27%),linear-gradient(135deg,#fff9ef,#f4e7d2);color:var(--ink);font:16px/1.45 system-ui,sans-serif;min-height:100vh}.wrap{width:min(920px,94%);margin:auto;padding:34px 0 70px}.hero{padding:32px;border-radius:28px;background:var(--wine);color:white;box-shadow:0 16px 40px #63352830}.tag{display:inline-block;padding:6px 12px;border-radius:99px;background:#f5c968;color:#5b3519;font-size:12px;font-weight:900;letter-spacing:.08em}.hero h1{margin:14px 0 8px;font:900 clamp(34px,7vw,60px)/.98 Georgia,serif}.hero p{margin:0;opacity:.9}.progress{height:9px;margin-top:23px;border-radius:20px;background:#ffffff2d;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#f5c968;transition:.3s}.tabs{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:99px;padding:11px 17px;background:white;color:var(--wine);font-weight:900;cursor:pointer;box-shadow:0 5px 16px #64401e17}.tabs button.active{background:var(--rust);color:white}.card{background:#fffdf8;border-radius:26px;padding:28px;box-shadow:0 12px 30px #75552d1c}.eyebrow{color:var(--rust);font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h2{margin:7px 0;font:800 clamp(27px,5vw,40px)/1.1 Georgia,serif}.instruction{color:#715f50}.arena{display:grid;place-items:center;min-height:260px;margin:24px 0;padding:24px;border:2px dashed #e5c9a1;border-radius:20px;text-align:center}.prompt{margin-bottom:24px;font-size:clamp(34px,7vw,62px);font-weight:900}.answers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answers button,.option{padding:13px 18px;border:2px solid #ead6bb;border-radius:15px;background:white;font:800 16px system-ui;cursor:pointer}.answers button:hover,.option:hover{border-color:var(--gold);transform:translateY(-2px)}.good{background:#e5f4e9!important;border-color:var(--ok)!important;color:#26613d}.wrong{background:#fde3e1!important;border-color:var(--bad)!important}.feedback{min-height:28px;color:var(--ok);font-weight:900}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:var(--rust);color:white}.score{color:var(--wine);font-weight:900}.choicebox{display:grid;gap:10px;width:min(600px,100%);text-align:left}.stem{margin-bottom:8px;font-size:clamp(25px,5vw,40px);font-weight:900}.option{text-align:left}.final{text-align:center;padding:45px}.big{font:900 72px Georgia;color:var(--wine)}
@media(max-width:560px){.hero,.card{padding:21px}.bottom .btn{flex:1}.score{order:-1;width:100%;text-align:center}.bottom{flex-wrap:wrap}}
</style></head>
<body><main class="wrap">
<header class="hero"><span class="tag">FRANÇAIS • A1</span><h1>Les verbes<br>du quotidien</h1><p>3 défis express : avoir, être, aller, prendre ou faire ?</p><div class="progress"><span id="bar"></span></div></header>
<nav class="tabs" id="tabs"></nav><section id="app"></section>
</main>
<script>
const bank={avoir:['faim','soif','peur','chaud','froid','raison'],être:['fatigué(e)','en retard','à l’heure','en forme','en vacances','malade'],aller:['au travail','à l’école','au marché','au restaurant','à pied','en voiture'],prendre:['une douche','un café','le petit déjeuner','des photos','une décision','le bus'],faire:['les courses','du sport','attention','la cuisine','une promenade','ses devoirs']};
const verbs=Object.keys(bank),all=verbs.flatMap(v=>bank[v].map(x=>({v,x}))),names=['1. Le bon verbe','2. L’intrus','5. Termine ma phrase'];let score=0,level=0,done=new Set();const app=document.querySelector('#app'),tabs=document.querySelector('#tabs');const pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);tabs.appendChild(b)});
function layout(num,title,instruction,inside){app.innerHTML=`<article class="card"><div class="eyebrow">Activité ${num} • 2–3 minutes</div><h2>${title}</h2><p class="instruction">${instruction}</p><div class="arena">${inside}</div><div class="feedback" id="fb"></div><div class="bottom"><button class="btn" onclick="newQuestion()">Nouvelle question ↻</button><span class="score">Score : <b id="score">${score}</b></span><button class="btn" onclick="next()">Suivant →</button></div></article>`}
function show(i){level=i;[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));newQuestion()}
function add(ok,msg){document.querySelector('#fb').textContent=msg;if(ok){score++;document.querySelector('#score').textContent=score}}
function next(){done.add(level);document.querySelector('#bar').style.width=`${done.size/3*100}%`;if(level<2)show(level+1);else finish()}
function newQuestion(){if(level===0)q1();else if(level===1)q2();else q5()}
function q1(){const a=pick(all);layout(1,'Le bon verbe','Choisis le verbe, puis prononce toute l’expression.',`<div><div class="prompt">${a.x}</div><div class="answers">${verbs.map(v=>`<button onclick="answer1(this,'${v}','${a.v}')">${v}</button>`).join('')}</div></div>`)}
function answer1(btn,v,right){document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);btn.classList.add(v===right?'good':'wrong');add(v===right,v===right?`✓ ${right} ${document.querySelector('.prompt').textContent}`:`Presque ! C’est « ${right} ».`)}
function q2(){const base=pick(verbs),other=pick(verbs.filter(v=>v!==base)),items=shuffle(bank[base].slice(0,3).map(x=>({x,v:base})).concat({x:pick(bank[other]),v:other}));layout(2,'L’intrus',`Trouve l’expression qui ne va pas avec « ${base} ».`,`<div><div class="prompt" style="font-size:30px">${base.toUpperCase()}</div><div class="answers">${items.map(o=>`<button onclick="answer2(this,'${o.v}','${base}')">${o.x}</button>`).join('')}</div></div>`)}
function answer2(btn,v,base){const ok=v!==base;btn.classList.add(ok?'good':'wrong');add(ok,ok?`✓ L’intrus va avec « ${v} ».`:`Non, cette expression va bien avec « ${base} ».`)}
const stems=[['Le matin, je prends…',['un café.','une douche.','le petit déjeuner.']],['Quand il fait chaud, j’ai…',['soif.','chaud.','envie d’une glace.']],['Le week-end, je fais…',['du sport.','les courses.','une promenade.']],['À 8 heures, je vais…',['au travail.','à l’école.','au marché.']],['Aujourd’hui, je suis…',['en forme.','fatigué(e).','en retard.']]];
function q5(){const q=pick(stems);layout(5,'Termine ma phrase','Choisis une fin possible, puis lis la phrase complète à voix haute.',`<div class="choicebox"><div class="stem">${q[0]}</div>${shuffle(q[1]).map(x=>`<button class="option" onclick="answer5(this)">${x}</button>`).join('')}<button class="option" onclick="answer5(this)">🎙️ Ma propre réponse</button></div>`)}
function answer5(btn){btn.classList.add('good');add(true,'✓ Très bien ! Lis maintenant la phrase complète à voix haute.')}
function finish(){done.add(2);document.querySelector('#bar').style.width='100%';app.innerHTML=`<article class="card final"><span class="tag">TERMINÉ !</span><h2>Bravo !</h2><div class="big">${score}</div><p>points gagnés aujourd’hui</p><button class="btn" onclick="score=0;done.clear();show(0)">Recommencer</button></article>`}
show(0);
</script></body></html>
