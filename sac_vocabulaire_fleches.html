<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qu'est-ce qu'il y a dans le sac ? — Étiquettes avec flèches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-deep:#e8558d;
    --pink-mid:#ff7fa8;
    --pink-light:#ffe3ee;
    --pink-pale:#fff5f9;
    --cream:#fffaf7;
    --ink:#3a2a35;
    --ok:#3fb27f;
    --ok-bg:#e6f8ef;
    --bad:#e8558d;
    --bad-bg:#ffe6ee;
    --shadow: 0 8px 24px rgba(232,85,141,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: linear-gradient(180deg,#fff0f6 0%, #fff9fb 40%, #fdf6ff 100%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:24px 12px 60px;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  header{text-align:center;margin-bottom:26px;}
  header h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(22px,4vw,30px);
    color:var(--pink-deep);
    margin:0 0 6px;
  }
  header p{margin:0;color:#9a7186;font-size:14px;}

  .bag-card{
    background:var(--cream);
    border-radius:22px;
    box-shadow:var(--shadow);
    border:1px solid #ffe0ec;
    padding:18px 16px 20px;
    margin-bottom:32px;
  }
  .bag-title{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--pink-deep);
    margin:0 0 12px;
    text-align:center;
  }

  .bag-diagram{
    position:relative;
    display:flex;
    align-items:stretch;
    gap:6px;
    min-height:260px;
  }
  .label-col{
    width:150px;
    flex:0 0 150px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .image-col{
    flex:1;
    position:relative;
    border-radius:14px;
    overflow:hidden;
    background:#c93f8d;
  }
  .image-col img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .pin{
    position:absolute;
    width:22px;
    height:22px;
    margin-left:-11px;
    margin-top:-11px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:2px solid var(--pink-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--pink-deep);
    cursor:pointer;
    z-index:3;
    transition: transform .12s ease, background .12s ease;
  }
  .pin:hover, .pin.dragover{
    transform:scale(1.25);
    background:#fff;
  }
  .pin.filled{
    background:var(--pink-deep);
    color:#fff;
  }

  .connector-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
  }

  .label-box{
    background:#fff;
    border:2px solid var(--pink-mid);
    color:var(--ink);
    font-family:'Fredoka',sans-serif;
    font-weight:500;
    font-size:12.5px;
    padding:5px 10px;
    border-radius:10px;
    cursor:pointer;
    position:absolute;
    max-width:142px;
    text-align:center;
    line-height:1.25;
    box-shadow:0 2px 6px rgba(232,85,141,0.15);
    z-index:4;
  }
  .label-box.correct{background:var(--ok-bg);border-color:var(--ok);color:#1f6e4a;}
  .label-box.incorrect{background:var(--bad-bg);border-color:var(--bad);color:#a1275a;}

  .tag-bank{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:16px;
    padding-top:14px;
    border-top:2px dashed var(--pink-mid);
    min-height:36px;
  }
  .tag{
    background:#fff;
    border:2px solid var(--pink-mid);
    color:var(--pink-deep);
    font-family:'Fredoka',sans-serif;
    font-weight:500;
    font-size:13px;
    padding:7px 13px;
    border-radius:999px;
    cursor:grab;
    user-select:none;
    transition: all .15s ease;
  }
  .tag:hover{background:var(--pink-mid);color:#fff;transform:translateY(-2px);}
  .tag.selected{outline:3px solid var(--pink-deep);}
  .tag.hidden-tag{display:none;}

  .controls{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:20px 0 10px;
    flex-wrap:wrap;
  }
  button.action{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 26px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition: all .15s ease;
    box-shadow:0 6px 16px rgba(232,85,141,0.25);
  }
  .btn-check{background:var(--pink-deep);color:#fff;}
  .btn-check:hover{background:#d43e77;transform:translateY(-2px);}
  .btn-reset{background:#fff;color:var(--pink-deep);border:2px solid var(--pink-mid);box-shadow:none;}
  .btn-reset:hover{background:var(--pink-light);}

  .score-banner{
    text-align:center;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:16px;
    margin:14px auto 30px;
    padding:12px;
    border-radius:14px;
    display:none;
    max-width:700px;
  }
  .score-banner.show{display:block;}
  .score-banner.good{background:var(--ok-bg);color:#1f6e4a;}
  .score-banner.mid{background:#fff3d6;color:#8a6a12;}
  .score-banner.low{background:var(--bad-bg);color:#a1275a;}

  @media (max-width:640px){
    .label-col{width:96px;flex:0 0 96px;}
    .label-box{font-size:11px;max-width:90px;padding:4px 7px;}
    .bag-diagram{min-height:220px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👜 Qu'est-ce qu'il y a dans le sac ?</h1>
    <p>Glissez chaque étiquette vers le bon numéro sur la photo (ou touchez le mot, puis touchez le numéro).</p>
  </header>

  <div id="bags-container"></div>

  <div class="controls">
    <button class="action btn-check" onclick="checkAll()">Vérifier</button>
    <button class="action btn-reset" onclick="resetAll()">Recommencer</button>
  </div>
  <div class="score-banner" id="scoreBanner"></div>
</div>

let selectedTag = null;
const container = document.getElementById('bags-container');

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildBag(bag){
  const card = document.createElement('div');
  card.className = 'bag-card';
  card.innerHTML = `
    <div class="bag-title">Sac ${bag.id}</div>
    <div class="bag-diagram" id="diagram-${bag.id}">
      <div class="label-col left" id="left-${bag.id}"></div>
      <div class="image-col" id="imgcol-${bag.id}">
        <img src="${bag.img}" alt="sac ${bag.id}">
      </div>
      <div class="label-col right" id="right-${bag.id}"></div>
      <svg class="connector-svg" id="svg-${bag.id}"></svg>
    </div>
    <div class="tag-bank" id="bank-${bag.id}"></div>
  `;
  container.appendChild(card);

  const imgcol = card.querySelector(`#imgcol-${bag.id}`);
  bag.pins.forEach(pin => {
    const pinEl = document.createElement('div');
    pinEl.className = 'pin';
    pinEl.dataset.pin = pin.id;
    pinEl.dataset.bag = bag.id;
    pinEl.style.left = pin.x + '%';
    pinEl.style.top = pin.y + '%';
    pinEl.textContent = pin.id;
    pinEl.addEventListener('dragover', e => { e.preventDefault(); pinEl.classList.add('dragover'); });
    pinEl.addEventListener('dragleave', () => pinEl.classList.remove('dragover'));
    pinEl.addEventListener('drop', e => {
      e.preventDefault();
      pinEl.classList.remove('dragover');
      const tagId = e.dataTransfer.getData('text/plain');
      placeTagOnPin(tagId, bag.id, pin.id);
    });
    pinEl.addEventListener('click', () => {
      if (selectedTag) {
        placeTagOnPin(selectedTag.dataset.tagid, bag.id, pin.id);
        selectedTag.classList.remove('selected');
        selectedTag = null;
      }
    });
    imgcol.appendChild(pinEl);
  });

  const bank = card.querySelector(`#bank-${bag.id}`);
  shuffle([...bag.pins]).forEach(pin => {
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = pin.word;
    tag.draggable = true;
    const tagId = `${bag.id}-${pin.id}`;
    tag.dataset.tagid = tagId;
    tag.dataset.bag = bag.id;
    tag.dataset.correctpin = pin.id;
    tag.dataset.word = pin.word;
    tag.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', tagId);
    });
    tag.addEventListener('click', () => {
      if (tag.classList.contains('hidden-tag')) return;
      if (selectedTag === tag) {
        tag.classList.remove('selected');
        selectedTag = null;
        return;
      }
      if (selectedTag) selectedTag.classList.remove('selected');
      selectedTag = tag;
      tag.classList.add('selected');
    });
    bank.appendChild(tag);
  });
}

BAGS.forEach(buildBag);

function findTag(tagId){
  return document.querySelector(`.tag[data-tagid="${tagId}"]`);
}

function placeTagOnPin(tagId, bagId, pinId){
  const tag = findTag(tagId);
  if (!tag) return;
  const pinEl = document.querySelector(`.pin[data-bag="${bagId}"][data-pin="${pinId}"]`);
  if (!pinEl) return;

  // if pin already occupied, return its current label's tag to bank first
  const existingLabel = document.querySelector(`.label-box[data-bag="${bagId}"][data-pin="${pinId}"]`);
  if (existingLabel) {
    returnLabelToBank(existingLabel);
  }

  // if this tag was already placed elsewhere, remove that label first
  const priorLabel = document.querySelector(`.label-box[data-tagid="${tagId}"]`);
  if (priorLabel) {
    priorLabel.remove();
  }

  const bagData = BAGS.find(b => b.id == bagId);
  const pinData = bagData.pins.find(p => p.id == pinId);
  const side = pinData.x < 50 ? 'left' : 'right';
  const col = document.getElementById(`${side}-${bagId}`);

  const label = document.createElement('div');
  label.className = 'label-box';
  label.textContent = tag.dataset.word;
  label.dataset.tagid = tagId;
  label.dataset.bag = bagId;
  label.dataset.pin = pinId;
  label.dataset.correctpin = tag.dataset.correctpin;
  label.addEventListener('click', () => returnLabelToBank(label));
  col.appendChild(label);

  tag.classList.add('hidden-tag');
  pinEl.classList.add('filled');

  layoutSide(bagId, 'left');
  layoutSide(bagId, 'right');
  requestAnimationFrame(() => drawLines(bagId));
}

function returnLabelToBank(label){
  const tagId = label.dataset.tagid;
  const bagId = label.dataset.bag;
  const pinId = label.dataset.pin;
  const tag = findTag(tagId);
  if (tag) tag.classList.remove('hidden-tag');
  const pinEl = document.querySelector(`.pin[data-bag="${bagId}"][data-pin="${pinId}"]`);
  if (pinEl) pinEl.classList.remove('filled');
  label.remove();
  layoutSide(bagId, 'left');
  layoutSide(bagId, 'right');
  requestAnimationFrame(() => drawLines(bagId));
}

function layoutSide(bagId, side){
  const col = document.getElementById(`${side}-${bagId}`);
  const labels = [...col.querySelectorAll('.label-box')];
  const bagData = BAGS.find(b => b.id == bagId);
  labels.sort((a,b) => {
    const pa = bagData.pins.find(p => p.id == a.dataset.pin);
    const pb = bagData.pins.find(p => p.id == b.dataset.pin);
    return pa.y - pb.y;
  });
  const colHeight = col.getBoundingClientRect().height || 260;
  const n = labels.length;
  labels.forEach((label, i) => {
    const topPct = n === 1 ? 45 : (i / (n - 1)) * 82 + 4;
    label.style.top = topPct + '%';
    label.style.left = side === 'left' ? '4px' : 'auto';
    label.style.right = side === 'right' ? '4px' : 'auto';
  });
}

function drawLines(bagId){
  const diagram = document.getElementById(`diagram-${bagId}`);
  const svg = document.getElementById(`svg-${bagId}`);
  const rect = diagram.getBoundingClientRect();
  svg.setAttribute('width', rect.width);
  svg.setAttribute('height', rect.height);
  svg.innerHTML = `<defs>
    <marker id="arrow-def-${bagId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff7fa8"/></marker>
    <marker id="arrow-ok-${bagId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb27f"/></marker>
    <marker id="arrow-bad-${bagId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8558d"/></marker>
  </defs>`;

  diagram.querySelectorAll('.label-box').forEach(label => {
    const pinId = label.dataset.pin;
    const pinEl = document.querySelector(`.pin[data-bag="${bagId}"][data-pin="${pinId}"]`);
    if (!pinEl) return;
    const lr = label.getBoundingClientRect();
    const pr = pinEl.getBoundingClientRect();
    const isLeft = label.parentElement.classList.contains('left');
    const x1 = (isLeft ? lr.right : lr.left) - rect.left;
    const y1 = (lr.top + lr.height/2) - rect.top;
    const x2 = (pr.left + pr.width/2) - rect.left;
    const y2 = (pr.top + pr.height/2) - rect.top;

    let color = '#ff7fa8', marker = `arrow-def-${bagId}`;
    if (label.classList.contains('correct')) { color = '#3fb27f'; marker = `arrow-ok-${bagId}`; }
    else if (label.classList.contains('incorrect')) { color = '#e8558d'; marker = `arrow-bad-${bagId}`; }

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('marker-end', `url(#${marker})`);
    svg.appendChild(line);
  });
}

function checkAll(){
  let total = 0, correct = 0, placed = 0;
  BAGS.forEach(bag => {
    total += bag.pins.length;
    document.querySelectorAll(`#diagram-${bag.id} .label-box`).forEach(label => {
      placed++;
      label.classList.remove('correct','incorrect');
      if (label.dataset.pin === label.dataset.correctpin) {
        label.classList.add('correct');
        correct++;
      } else {
        label.classList.add('incorrect');
      }
    });
    drawLines(bag.id);
  });

  const banner = document.getElementById('scoreBanner');
  banner.className = 'score-banner show';
  if (placed < total) {
    banner.classList.add('mid');
    banner.textContent = `Il reste des étiquettes à placer (${placed}/${total}).`;
    return;
  }
  const pct = Math.round((correct/total)*100);
  if (pct === 100) {
    banner.classList.add('good');
    banner.textContent = `🎉 Parfait ! ${correct}/${total} étiquettes bien placées.`;
  } else if (pct >= 60) {
    banner.classList.add('mid');
    banner.textContent = `👍 ${correct}/${total} correctes (${pct}%). Corrigez les flèches roses/rouges !`;
  } else {
    banner.classList.add('low');
    banner.textContent = `Continuez — ${correct}/${total} correctes (${pct}%).`;
  }
}

function resetAll(){
  document.querySelectorAll('.label-box').forEach(l => l.remove());
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('hidden-tag','selected'));
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('filled'));
  selectedTag = null;
  BAGS.forEach(bag => drawLines(bag.id));
  const banner = document.getElementById('scoreBanner');
  banner.className = 'score-banner';
  banner.textContent = '';
}

window.addEventListener('resize', () => {
  BAGS.forEach(bag => drawLines(bag.id));
});
window.addEventListener('load', () => {
  BAGS.forEach(bag => drawLines(bag.id));
});
</script>
</body>
</html>
