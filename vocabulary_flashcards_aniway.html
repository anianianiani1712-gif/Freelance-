<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Flashcards — Aniway English</title>
<style>
:root{--bg:#fbf0f5;--ink:#29232d;--purple:#e5cff4;--yellow:#fff2a9;--pink:#f8c7c9;--blue:#b9def8;--cyan:#a9e0eb;--green:#cce4a3;--accent:#8054a3}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(#e9d7e4 1px,transparent 1px),var(--bg);background-size:18px 18px;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
header{padding:24px 18px 12px;text-align:center}h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:0 0 8px;letter-spacing:-.04em}header p{margin:0;color:#6f6272}
.app{max-width:900px;margin:0 auto;padding:12px 18px 36px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0 20px}
select,button{font:inherit;border:1px solid #d9c6df;border-radius:13px;padding:10px 14px;background:#fffafc;color:var(--ink);cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}
.progress-wrap{height:7px;background:#eadce9;border-radius:9px;overflow:hidden;margin:0 auto 16px;max-width:620px}.progress{height:100%;width:0;background:var(--accent);transition:width .2s}
.counter{text-align:center;color:#766a79;font-size:.92rem;margin-bottom:12px}
.stage{perspective:1200px;max-width:620px;margin:0 auto}.card{min-height:330px;position:relative;transform-style:preserve-3d;transition:transform .45s;cursor:pointer;outline:none}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:24px;box-shadow:0 12px 26px #593f5518;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;backface-visibility:hidden;border:1px solid #ffffff9c}.front{background:var(--card-color,var(--purple))}.back{background:#fffafc;transform:rotateY(180deg);flex-direction:column;gap:12px}.word{font-size:clamp(1.8rem,6vw,3.3rem);font-weight:650;line-height:1.15;letter-spacing:-.035em;overflow-wrap:anywhere}.hint{position:absolute;bottom:18px;font-size:.8rem;color:#66566b;opacity:.8}.translation{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:650}.example{font-size:1.05rem;line-height:1.5;max-width:470px}.example em{color:var(--accent);font-style:normal;font-weight:650}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.grade{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.grade button{min-width:130px}.grade .again{background:#ffe0df}.grade .known{background:#e1f2d2}.below{display:flex;justify-content:space-between;gap:10px;max-width:620px;margin:14px auto 0;flex-wrap:wrap}.below button{flex:1}.stats{display:flex;justify-content:center;gap:18px;color:#756979;font-size:.9rem;margin:18px 0}.empty{text-align:center;padding:70px 15px;font-size:1.2rem}.footer{text-align:center;color:#817283;font-size:.8rem;margin-top:30px}
@media(max-width:520px){.app{padding:8px 12px 28px}.card{min-height:300px}.face{padding:24px}.word{font-size:2rem}.below button{min-width:28%}.grade button{flex:1;min-width:110px}}
</style>
</head>
<body>
<header><h1>Vocabulary Flashcards</h1><p>Карточки для активного запоминания слов и выражений</p></header>
<main class="app">
<div class="toolbar">
<select id="group" aria-label="Группа слов"><option value="all">Все карточки</option><option value="purple">Сиреневые</option><option value="yellow">Жёлтые</option><option value="pink">Розовые</option><option value="blue">Голубые</option><option value="green">Зелёные</option></select>
<select id="mode" aria-label="Направление"><option value="en">English → Русский</option><option value="ru">Русский → English</option></select>
<button id="shuffle">Перемешать</button>
<button id="reset">Сбросить прогресс</button>
</div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="counter" id="counter"></div>
<div class="stage" id="stage">
<div class="card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку">
<div class="face front" id="front"><div class="word" id="frontText"></div><div class="hint">Нажми, чтобы увидеть ответ</div></div>
<div class="face back" id="back"><div class="translation" id="backText"></div><div class="example" id="example"></div><div class="hint">Нажми ещё раз, чтобы вернуться</div></div>
</div></div>
<div class="controls"><button id="prev">← Назад</button><button class="primary" id="flip">Показать ответ ↻</button><button id="next">Дальше →</button></div>
<div class="grade"><button class="again" id="again">↻ Повторить</button><button class="known" id="known">✓ Знаю</button></div>
<div class="stats"><span id="knownCount">Знаю: 0</span><span id="againCount">Повторить: 0</span></div>
<div class="footer">@aniway.english</div>
</main>
<script>
const cards = [
["rarely","редко","I rarely watch TV.","purple"],
["investigate something","расследовать что-либо","The police investigated the case.","purple"],
["a bench / a few benches","скамейка / несколько скамеек","We sat on a bench in the park.","purple"],
["refuse to do something","отказываться что-либо делать","He refused to answer the question.","purple"],
["join something","вступить / присоединиться к чему-либо","She wants to join a gym.","purple"],
["playground","детская площадка","The children are playing in the playground.","purple"],
["muddy","грязный, покрытый грязью (о дорожках, лужах)","The path is muddy after the rain.","purple"],
["ask for something","просить что-либо; ask for advice — просить совета","You should ask for help.","purple"],
["plenty of","много, plenty of apples / water","There is plenty of time.","yellow"],
["be going to","собираться что-либо сделать","I’m going to call her tonight.","yellow"],
["very soon","очень скоро","The bus will arrive very soon.","yellow"],
["guess","угадывать; предполагать","Can you guess the answer?","yellow"],
["I think, I will…","Думаю, я… (для спонтанного решения/предположения)","I think I’ll stay at home.","yellow"],
["I have / haven’t seen…","Я видел(а) / не видел(а)…","I’ve seen this film before.","yellow"],
["main character","главный персонаж","The main character is very brave.","yellow"],
["old-fashioned","устаревший; старомодный","That phone looks old-fashioned.","yellow"],
["fear","страх; бояться","She has a fear of spiders.","yellow"],
["patient","терпеливый; пациент","You need to be patient.","yellow"],
["recently","недавно; за последнее время","Have you seen him recently?","yellow"],
["an excited girl / an exciting film","взволнованная девочка / захватывающий фильм","The girl is excited. The film is exciting.","yellow"],
["event","событие; мероприятие","It was an important event.","yellow"],
["I agree with you","Я с тобой согласен / согласна","I agree with you about this.","yellow"],
["charge","заряжать; I need to charge my phone — мне нужно зарядить телефон","I need to charge my phone.","pink"],
["run down","разряжаться; My battery is running down — батарея разряжается","My battery is running down.","pink"],
["earphones / headphones","наушники-вкладыши / наушники","I forgot my headphones.","pink"],
["turn something on / off","включать / выключать что-либо","Please turn the lights off.","pink"],
["good sound / noise cancelling","хороший звук / шумоподавление","These headphones have good sound.","pink"],
["useful / useless","полезный / бесполезный","This app is really useful.","pink"],
["once in a while","время от времени; не очень часто","We eat out once in a while.","pink"],
["confusing","сбивающий с толку, запутанный","The instructions are confusing.","pink"],
["on the 1st of August","первого августа","The course starts on the 1st of August.","pink"],
["artist","художник; артист (в зависимости от контекста)","She is a talented artist.","pink"],
["shop / supermarket","магазин / супермаркет","I’m going to the supermarket.","pink"],
["script","сценарий; текст для исполнения","The actor learned the script.","pink"],
["get well soon / get better soon","скорее выздоравливай / скоро поправиться","I hope you get better soon.","pink"],
["stay overnight","остаться на ночь","Can I stay overnight?","pink"],
["fall asleep","заснуть","I fell asleep on the sofa.","pink"],
["take place","происходить, состояться","The festival takes place in June.","pink"],
["it’s a total waste of time","это полная трата времени","Arguing about it is a total waste of time.","pink"],
["look something up","искать информацию (например, в словаре)","I’ll look the word up in a dictionary.","pink"],
["prepare = get ready","готовиться; подготовиться","I need to get ready for school.","pink"],
["huge","огромный","They live in a huge house.","purple"],
["instead of","вместо","We walked instead of taking a taxi.","purple"],
["decide / make a decision","решать / принимать решение","She made a decision yesterday.","purple"],
["reach","достичь (кульминации, вершины, цели)","He reached his goal.","purple"],
["front row / back row","первый ряд / последний ряд","We sat in the front row.","purple"],
["get on with someone","ладить с кем-либо","Do you get on with your neighbours?","purple"],
["adventure","приключение","The trip was a real adventure.","purple"],
["I’ve just discovered it","Я только что это обнаружил(а)","I’ve just discovered a great café.","purple"],
["earn money","зарабатывать деньги","She wants to earn more money.","blue"],
["a collection of poems by Akhmatova","сборник стихотворений Ахматовой","I found a collection of poems by Akhmatova.","blue"],
["incense","благовония","The room smelled of incense.","blue"],
["it’s not a big deal","ничего страшного; это не проблема","Don’t worry, it’s not a big deal.","blue"],
["on the 30th of September","тридцатого сентября","The event is on the 30th of September.","blue"],
["doubt","сомневаться; сомнение","I doubt that he is right.","blue"],
["herself / on her own","сама; самостоятельно","She did it on her own.","blue"],
["mascot","талисман","The tiger is the team’s mascot.","blue"],
["lose weight","сбрасывать вес, худеть","He wants to lose weight.","purple"],
["get in shape / get physically fit","привести себя в форму","She exercises to get in shape.","purple"],
["to determine / a determined person","определять / целеустремлённый человек","She is a determined person.","green"],
["ambitious","амбициозный; целеустремлённый","He is ambitious and hardworking.","green"],
["the elephant in the room","очевидная проблема, которую все избегают обсуждать","We need to talk about the elephant in the room.","green"],
["lead a healthy lifestyle / stick to a healthy lifestyle","вести здоровый образ жизни / придерживаться здорового образа жизни","It’s important to stick to a healthy lifestyle.","purple"]
];
let deck=[...cards], index=0, flipped=false, known=new Set(), again=new Set();
const $=id=>document.getElementById(id);
function filtered(){const g=$("group").value;return cards.filter(c=>g==="all"||c[3]===g)}
function syncDeck(keepCurrent=false){const old=deck[index];deck=filtered();if(keepCurrent&&old){const found=deck.findIndex(c=>c[0]===old[0]);index=found>=0?found:0}else index=0;render()}
function render(){
 if(!deck.length){$("stage").innerHTML='<div class="empty">В этой группе пока нет карточек.</div>';return}
 if(!$("card")) return;
 index=(index+deck.length)%deck.length;flipped=false;$("card").classList.remove("flipped");
 const c=deck[index], reverse=$("mode").value==="ru";
 $("frontText").textContent=reverse?c[1]:c[0];$("backText").textContent=reverse?c[0]:c[1];$("example").textContent=c[2];
 const colors={purple:"#e5cff4",yellow:"#fff2a9",pink:"#f8c7c9",blue:"#b9def8",green:"#cce4a3"};
 $("front").style.setProperty("--card-color",colors[c[3]]||colors.purple);
 $("counter").textContent=`Карточка ${index+1} из ${deck.length}`;
 $("progress").style.width=`${((index+1)/deck.length)*100}%`;
 $("knownCount").textContent=`Знаю: ${known.size}`;$("againCount").textContent=`Повторить: ${again.size}`;
 $("prev").disabled=deck.length<2;$("next").disabled=deck.length<2;
}
function flip(){flipped=!flipped;$("card").classList.toggle("flipped",flipped)}
function move(n){index=(index+n+deck.length)%deck.length;render()}
$("card").addEventListener("click",flip);$("flip").addEventListener("click",flip);
$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));
$("again").addEventListener("click",()=>{again.add(deck[index][0]);known.delete(deck[index][0]);move(1)});
$("known").addEventListener("click",()=>{known.add(deck[index][0]);again.delete(deck[index][0]);move(1)});
$("group").addEventListener("change",()=>{ $("stage").innerHTML='<div class="card" id="card" tabindex="0" role="button"><div class="face front" id="front"><div class="word" id="frontText"></div><div class="hint">Нажми, чтобы увидеть ответ</div></div><div class="face back" id="back"><div class="translation" id="backText"></div><div class="example" id="example"></div><div class="hint">Нажми ещё раз, чтобы вернуться</div></div></div>'; $("card").addEventListener("click",flip);syncDeck()});
$("mode").addEventListener("change",render);
$("shuffle").addEventListener("click",()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;render()});
$("reset").addEventListener("click",()=>{known.clear();again.clear();render()});
document.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){if(document.activeElement.tagName!=="BUTTON"&&document.activeElement.tagName!=="SELECT"){e.preventDefault();flip()}}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1)});
render();
</script>
</body></html>
